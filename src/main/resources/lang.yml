      8: '&6/f promote <Ник_Игрока>&e - Повысить игрока по статусу.'
      9: '&6/f demote <Ник_Игрока>&e - Понизить игрока по статусу.'
      10: '&6/f c <Сообщение>&e - Написать сообщение в чат клана.'
  leave:
    usage: '&6/f leave&e - Покинуть клан.'
