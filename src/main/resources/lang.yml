      1: '&6/f help&e - Помощь по командам.'
      2: '&6/f create&e <Имя_Клана> - Создать клан.'
      3: '&6/f join&e <Имя_Клана> - Вступить в клан.'
      4: '&6/f leave&e - Покинуть клан.'
      5: '&6/f invite <Ник_Игрока>&e - Пригласить игрока в клан.'
      6: '&6/f uninvite <Ник_Игрока>&e - Отозвать приглашение у игрока.'
